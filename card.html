<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anthony Réveillac · Business card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#F7F6F2; --card:#FFFFFF; --ink:#2C2C2A; --text:#3a3a38; --muted:#888780; --line:rgba(44,44,42,.12);
  --accent:#D85A30; --accent-dk:#993C1D; --band:#2C2C2A; --btn:#FFFFFF; --shadow:0 1px 2px rgba(44,44,42,.06),0 18px 40px -20px rgba(44,44,42,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#1E1E1D; --card:#2C2C2A; --ink:#F4F2EC; --text:#E2E0DA; --muted:#A8A7A0; --line:rgba(255,255,255,.14);
    --accent:#E0703F; --accent-dk:#D85A30; --band:#1A1A19; --btn:#2C2C2A; --shadow:0 1px 2px rgba(0,0,0,.4),0 20px 44px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --page:#1E1E1D; --card:#2C2C2A; --ink:#F4F2EC; --text:#E2E0DA; --muted:#A8A7A0; --line:rgba(255,255,255,.14);
    --accent:#E0703F; --accent-dk:#D85A30; --band:#1A1A19; --btn:#2C2C2A; --shadow:0 1px 2px rgba(0,0,0,.4),0 20px 44px -18px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--page);color:var(--ink);
  font-family:"Inter",system-ui,-apple-system,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 16px;gap:22px;
}
.stage{width:min(100%,520px);perspective:1400px}
.card{
  position:relative;width:100%;aspect-ratio:85.6/54;
  transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1);
  cursor:pointer;border-radius:14px;outline:none;
}
.card.flipped{transform:rotateY(180deg)}
.card:focus-visible{box-shadow:0 0 0 3px var(--page),0 0 0 5px var(--accent)}
.face{
  position:absolute;inset:0;border-radius:14px;background:var(--card);
  box-shadow:var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
}
.front{display:flex;flex-direction:column}
.main{flex:1;min-height:0;display:flex;align-items:center;gap:6%;padding:0 7%}
.photo{width:29%;aspect-ratio:1;flex:none;border-radius:50%;padding:3px;border:2px solid rgba(216,90,48,.35)}
.photo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.id{min-width:0}
.name{font-family:"Lora",Georgia,serif;font-weight:600;color:var(--ink);
  font-size:clamp(1.2rem,5vw,1.85rem);line-height:1.1;margin:0}
.role{margin:.45em 0 0;font-size:clamp(.74rem,2.6vw,.92rem);line-height:1.35;color:var(--text)}
.org{margin:.2em 0 0;font-size:clamp(.68rem,2.35vw,.84rem);color:var(--muted);line-height:1.35}
.band{background:var(--band);border-top:2px solid var(--accent);padding:3.2% 7%;display:flex;align-items:center;justify-content:space-between;gap:1em}
.mail{color:#fff;text-decoration:none;font-size:clamp(.68rem,2.4vw,.85rem);position:relative;z-index:2}
.mail:hover{color:#FAECE7;text-decoration:underline;text-underline-offset:3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.back{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;gap:6%;padding:6%}
.qrbox{height:100%;aspect-ratio:1;background:#fff;border-radius:8px;padding:2.5%;flex:none}
.qrbox svg{display:block;width:100%;height:100%}
.qrbox svg path{fill:#2C2C2A}
.qrinfo{max-width:42%}
.qrinfo h2{color:var(--ink);font-family:"Lora",Georgia,serif;font-weight:600;font-size:clamp(1rem,4vw,1.4rem);margin:0 0 .35em;line-height:1.15}
.qrinfo p{margin:0;color:var(--muted);font-size:clamp(.72rem,2.5vw,.9rem);line-height:1.4}
[hidden]{display:none!important}
.controls{width:min(100%,520px);display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{
  font:inherit;font-size:.95rem;font-weight:600;color:var(--ink);background:var(--btn);
  border:1px solid var(--line);border-radius:8px;padding:.6em 1.1em;transition:border-color .2s,color .2s;cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;gap:.45em;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn--coral{background:var(--accent);border-color:var(--accent);color:#fff}
.btn--coral:hover{background:var(--accent-dk);border-color:var(--accent-dk);color:#fff}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:1em;height:1em;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--btn)}
.seg button{font:inherit;font-size:.9rem;font-weight:600;border:0;background:none;color:var(--muted);
  padding:.45em 1em;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:.85rem;color:var(--muted);margin:0;text-align:center}
@media (max-width:420px){ .main{gap:5%;padding:0 6%} .back{gap:5%;padding:5.5%} .qrinfo{max-width:46%} }
@media (prefers-reduced-motion:reduce){
  .card,.btn{transition:none}
}
</style>
</head>

<script>
(function(){
  var card=document.getElementById('card'), flip=document.getElementById('flip'),
      label=flip.querySelector('span'), seg=document.getElementById('seg');
  var qs={site:document.getElementById('qr-site'),contact:document.getElementById('qr-contact')};
  var txt={site:['Academic website','Scan to open research, publications and teaching.'],
           contact:['Save the contact','Scan to add Anthony to your phone’s contacts.']};
  function setFlip(on){
    card.classList.toggle('flipped',on);
    label.textContent=on?'Show front':'Show QR code';
    seg.hidden=!on;
    card.setAttribute('aria-label',on?'Business card, back side with QR code. Press to flip.':'Business card. Press to flip and show the QR code.');
  }
  function toggle(){setFlip(!card.classList.contains('flipped'))}
  card.addEventListener('click',function(e){ if(e.target.closest('a'))return; toggle(); });
  card.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();} });
  flip.addEventListener('click',toggle);
  seg.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b)return;
    var k=b.dataset.q;
    seg.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
    Object.keys(qs).forEach(function(n){qs[n].hidden=(n!==k)});
    document.getElementById('qr-title').textContent=txt[k][0];
    document.getElementById('qr-desc').textContent=txt[k][1];
    setFlip(true);
  });
})();
</script>
